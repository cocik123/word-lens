<html lang="ko">
<head>
<meta charset="utf-8">

<title>단어 돋보기</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c6a50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단어 돋보기">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<!-- 한국어 글꼴에는 한국에서 쓰는 한자만 들어 있다. 일본 신자체·간체·드문 글자는 아래 글꼴이 받는다. 화면을 막지 않게 나중에 불러온다. -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&family=Noto+Serif+TC:wght@600&family=Noto+Sans+JP&family=Noto+Sans+TC&family=Noto+Sans+HK&display=swap">
<style>
/* 레이아웃: 한 손으로 쓰는 한 줄기 화면. 위에서부터 [찍기·말하기·입력] → [찾은 단어] → [풀이 카드] → [단어장] → [설정] */
:root{
  --bg:#f4f6f2; --surface:#ffffff; --fg:#18211d; --muted:#5d6b64; --line:#d7ddd6;
  --accent:#1c6a50; --on-accent:#ffffff; --marker:#ffe169; --marker-fg:#2a2400; --warn:#a4372a;
  --pic-bg:#fbfcf8;
  --serif:"Noto Serif KR","Noto Serif JP","Noto Serif TC","Noto Sans HK","Apple SD Gothic Neo","Malgun Gothic",serif;
  --sans:"Noto Sans KR","Noto Sans JP","Noto Sans TC","Noto Sans HK","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#121815; --surface:#1b2420; --fg:#e6ede8; --muted:#9aa9a1; --line:#2f3b35;
  --accent:#74d3a6; --on-accent:#0c1a14; --marker:#7a6510; --marker-fg:#fff6c9; --warn:#ff9c8c;
  color-scheme:dark } }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--serif);font-weight:900;font-size:1.5rem;margin:0;letter-spacing:-.01em}
h2{font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.capture{display:flex;flex-direction:column;gap:10px}
.shots{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;display:block}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-size:1.1rem;padding:18px 14px}
.btn.small{padding:6px 12px;font-size:.85rem;font-weight:500;border-radius:999px}
.btn:disabled{opacity:.5}
.shots input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.shots label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.shots label.side{display:flex;align-items:center;justify-content:center}
form.find{display:flex;gap:8px}
input[type=text],input[type=password],select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-width:0}
form.find input{flex:1}
#mic.on{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.status{color:var(--muted);font-size:.9rem;min-height:1.4em;margin:0}
.status.err{color:var(--warn)}

.found{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--marker);color:var(--marker-fg);border-radius:6px;padding:8px 10px;text-align:left;line-height:1.3}
.chip b{font-family:var(--serif);font-size:1.05rem;display:block}
.chip span{font-size:.8rem;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.card .tag{align-self:flex-start;font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.hw{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.hw .w{font-family:var(--serif);font-weight:900;font-size:2rem;line-height:1.2;overflow-wrap:anywhere}
.hw .r{color:var(--muted)}
.hw .pos{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.gloss{font-size:1.15rem;font-weight:700;margin:0}
.tr{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:.95rem;margin:0}
.tr b{color:var(--fg);font-weight:500}
.card p{margin:0;overflow-wrap:anywhere}
.sec{display:flex;flex-direction:column;gap:8px}
.parts{display:flex;flex-direction:column;gap:10px}
.part{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;border-top:1px dashed var(--line);padding-top:10px}
.part .g{font-family:var(--serif);font-weight:600;font-size:2.4rem;line-height:1.1;grid-row:span 3;min-width:1.2em;text-align:center;color:var(--accent)}
.part .g.long{font-size:1.25rem;line-height:1.5;text-align:left}
.part .pr{color:var(--muted);font-size:.9rem;min-width:0}
.part .ps{font-weight:700;min-width:0}
.part .pn{font-size:.95rem;min-width:0}
.ex{border-left:3px solid var(--marker);padding-left:12px}
.ex small{display:block;color:var(--muted);font-size:.9rem}
.pic{background:var(--pic-bg);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.pic img{display:block;width:100%;height:auto}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.photos a{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);text-decoration:none;min-width:0}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--pic-bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row a{font-weight:500;padding:6px 0;margin-right:8px}
.dots::after{content:"…";animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dots::after{animation:none}}

.hist{display:flex;flex-direction:column;gap:10px}
.hist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li button{width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;text-align:left;display:flex;gap:12px;align-items:baseline}
.hist li b{font-family:var(--serif);flex:none;max-width:45%;overflow-wrap:anywhere}
.hist li span{color:var(--muted);font-size:.9rem;min-width:0;overflow-wrap:anywhere}

details.set{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 18px}
details.set summary{font-weight:700;cursor:pointer}
.set .body{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.set ol{margin:0;padding-left:1.2em;font-size:.95rem}
.set .keyrow{display:flex;gap:8px}
.set .keyrow input{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>단어 돋보기</h1>
    <span class="status" id="modelNote"></span>
  </header>

  <section class="capture" aria-label="단어 넣기">
    <div class="shots">
      <label class="btn primary">책 페이지 찍기<input type="file" id="cam" accept="image/*" capture="environment"></label>
      <label class="btn side">앨범에서<input type="file" id="pick" accept="image/*"></label>
    </div>
    <form class="find" id="form">
      <input id="q" type="text" autocomplete="off" autocapitalize="off" placeholder="단어를 쓰거나 말하기" aria-label="찾을 단어">
      <button type="button" class="btn" id="mic" hidden aria-pressed="false">말하기</button>
      <button type="submit" class="btn">찾기</button>
    </form>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="found" id="foundSec" hidden>
    <h2>이 페이지의 어려운 단어 · 눌러서 풀이</h2>
    <div class="chips" id="chips"></div>
  </section>

  <section id="cardSlot" aria-live="polite"></section>

  <section class="hist">
    <div class="row" style="justify-content:space-between">
      <h2>단어장 <span id="histCount"></span></h2>
      <button type="button" class="btn small" id="exportBtn" hidden>Anki용으로 내보내기</button>
    </div>
    <p class="status" id="histNote"></p>
    <ul id="histList"></ul>
  </section>

  <details class="set" id="setBox">
    <summary>설정 · API 키</summary>
    <div class="body">
      <ol>
        <li><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에 구글 계정으로 들어가 "API 키 만들기"를 누릅니다. 카드 등록 없이 무료입니다.</li>
        <li>만든 키를 복사해 아래 칸에 붙여 넣고 "저장하고 확인"을 누릅니다.</li>
      </ol>
      <div class="keyrow">
        <input type="password" id="key" autocomplete="off" placeholder="Gemini API 키" aria-label="Gemini API 키">
        <button type="button" class="btn" id="saveKey">저장하고 확인</button>
      </div>
      <p class="status" id="keyNote"></p>
      <label>말하기 언어
        <select id="speechLang"><option value="ko-KR">한국어</option><option value="en-US">English</option><option value="ja-JP">日本語</option></select>
      </label>
      <p class="status">키는 이 기기에만 저장되고, 단어를 찾을 때 Google로만 전송됩니다. 무료 키로 보낸 내용은 Google이 서비스 개선에 쓸 수 있으니 개인적인 문서는 찍지 마세요.</p>
    </div>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false || c === "") continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (_) { return false; } }
};

/* ---------- 상태 ---------- */
let words = ls.get("dd.words", []), found = [], shown = null;
const C = {};                                   // 종류별 진행 중인 호출: s=사진, d=풀이, p=그림
function begin(kind){ C[kind]?.abort(); return (C[kind] = new AbortController()); }
function say(msg, err){ const s = $("status"); s.textContent = msg || ""; s.classList.toggle("err", !!err); }

/* ---------- Gemini 호출 ----------
   무료 키는 모델마다 하루 한도가 따로 있다. 그래서 한도가 넉넉한 가벼운 모델(flash-lite)부터 쓰고,
   한도(429)에 걸리면 다음 모델로 넘어간다. 모델 이름은 자주 바뀌므로 키를 저장할 때 목록을 받아 온다. */
const API = "https://generativelanguage.googleapis.com/v1beta";
const DEFAULT_MODELS = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.8-flash", "gemini-3.6-flash"];
const getKey = () => ls.get("dd.key", "");
const getModels = () => { const m = ls.get("dd.models", null); return Array.isArray(m) && m.length ? m : DEFAULT_MODELS; };
const ver = m => parseFloat((m.match(/gemini-([\d.]+)/) || [])[1]) || 0;

async function listModels(key){
  const res = await fetch(API + "/models?pageSize=200", {headers: {"x-goog-api-key": key}});
  if (!res.ok) throw {code: res.status === 400 || res.status === 401 || res.status === 403 ? "bad_key" : "upstream"};
  const names = ((await res.json()).models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => m.name.replace("models/", ""))
    .filter(n => /^gemini-[\d.]+-flash(-lite)?(-preview)?$/.test(n));
  const lite = names.filter(n => /lite/.test(n)).sort((a, b) => ver(b) - ver(a));
  const full = names.filter(n => !/lite/.test(n)).sort((a, b) => ver(b) - ver(a));
  return [...lite.slice(0, 3), ...full.slice(0, 3)];
}
async function ai(prompt, opt){
  opt = opt || {};
  const key = getKey();
  if (!key) throw {code: "no_key"};
  let order = getModels();
  if (opt.best) order = [...order.filter(m => !/lite/.test(m)), ...order.filter(m => /lite/.test(m))];
  const parts = [{text: prompt}];
  if (opt.image) parts.push({inline_data: {mime_type: "image/jpeg", data: opt.image}});
  const bodyStr = JSON.stringify({contents: [{role: "user", parts}], generationConfig: {temperature: 0.3}});
  let last = {code: "upstream"};
  for (const m of order) {
    let res;
    try {
      res = await fetch(`${API}/models/${m}:streamGenerateContent?alt=sse`, {method: "POST", signal: opt.signal,
        headers: {"content-type": "application/json", "x-goog-api-key": key}, body: bodyStr});
    } catch (e) { throw {code: e.name === "AbortError" ? "cancelled" : "offline"}; }
    if (!res.ok) {
      let msg = ""; try { msg = ((await res.json()).error || {}).message || ""; } catch (_) {}
      if (res.status === 429) { last = {code: "quota"}; continue; }
      if (res.status === 404 || res.status >= 500) { last = {code: "upstream"}; continue; }
      if (res.status === 401 || res.status === 403 || /API key/i.test(msg)) throw {code: "bad_key"};
      throw {code: "upstream"};
    }
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "";
    try {
      for (;;) {
        const {done, value} = await rd.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let i;
        while ((i = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if (!line.startsWith("data:")) continue;
          try {
            const j = JSON.parse(line.slice(5));
            for (const p of (((j.candidates || [])[0] || {}).content || {}).parts || []) if (p.text && !p.thought) text += p.text;
            if (opt.onText) opt.onText(text);
          } catch (_) {}
        }
      }
    } catch (e) {
      if (e.name === "AbortError" || (opt.signal && opt.signal.aborted)) throw {code: "cancelled", text};
      if (!text) { last = {code: "upstream"}; continue; }
      throw {code: "upstream", text};
    }
    if (!text.trim()) { last = {code: "empty"}; continue; }
    $("modelNote").textContent = m.replace("gemini-", "");
    return text;
  }
  throw last;
}
const COPY = {
  no_key: "먼저 아래 '설정'에서 무료 API 키를 넣어 주세요.",
  bad_key: "API 키가 맞지 않습니다. 아래 '설정'에서 키를 다시 확인해 주세요.",
  quota: "오늘 무료 한도를 다 썼습니다. 한도는 매일 다시 채워집니다. 이미 찾은 단어는 단어장에서 볼 수 있습니다.",
  offline: "인터넷에 연결되지 않았습니다.",
  empty: "답을 받지 못했습니다. 다시 눌러 주세요."
};
const copyFor = code => COPY[code] || "Google 쪽 응답이 끊겼습니다. 다시 눌러 주세요.";
function needKey(code){ if (code === "no_key" || code === "bad_key") { $("setBox").open = true; $("setBox").scrollIntoView({behavior: "smooth"}); } }

/* 사진은 긴 변 1600px JPEG로 줄여 보낸다. 글자를 읽는 데는 충분하고 전송은 훨씬 빠르다. */
async function shrink(file){
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch (_) {
    bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); });
  }
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", 0.85).split(",")[1];
}

function parseLines(text, done){
  const rows = text.split("\n");
  if (!done) rows.pop();                         // 아직 쓰는 중인 마지막 줄은 버린다
  const out = [];
  for (let l of rows) {
    l = l.trim().replace(/,$/, "");
    if (l[0] !== "{") continue;
    // 부수 전용 문자(⼚ U+2F1A 등)는 글꼴에 없는 경우가 많아, 모양이 같은 일반 한자(厂)로 바꾼다.
    l = l.replace(/[⺀-⿟]/g, ch => ch.normalize("NFKC"));
    try { out.push(JSON.parse(l)); } catch (_) {}
  }
  return out;
}
function idFor(word){
  let x = 0x811c9dc5;
  for (const ch of word.trim().toLowerCase()) { x ^= ch.codePointAt(0); x = Math.imul(x, 0x01000193) >>> 0; }
  return "w" + x.toString(16) + "-" + [...word.trim()].length;
}

/* ---------- 프롬프트 ---------- */
const SCAN_PROMPT = `이 사진은 독자가 읽던 책의 한 페이지 또는 그 일부다. 사진 속 글에서 독자가 뜻을 몰라 막혔을 만한 단어를 골라라.
- 한국어 글: 한국 성인 독자가 뜻을 정확히 설명하기 어려운 단어(어려운 한자어, 전문용어, 옛말, 낯선 외래어, 드문 표현, 사자성어).
- 외국어 글: 중급 학습자가 모를 만한 단어와 숙어.
- 누구나 아는 기본 단어, 조사, 사람 이름은 뺀다. 사진에 단어가 몇 개만 크게 찍혔으면 그 단어들은 기본 단어라도 넣는다.
어려운 것부터 최대 20개. 한 줄에 JSON 객체 하나씩만 출력하고 다른 글이나 코드펜스는 쓰지 않는다:
{"w":"사전에 실리는 기본형","r":"읽는 법(한자·일본어 표기일 때만, 아니면 빈 문자열)","g":"이 문맥에서의 뜻, 한국어 15자 이내","c":"그 단어가 들어 있는 문장, 60자 이내"}
글자를 읽을 수 없으면 {"err":"이유를 한국어 한 문장으로"} 한 줄만 출력한다.`;

function detailPrompt(word, ctx){
  return `너는 책을 읽다가 모르는 단어를 만난 독자를 돕는 사전이다. 독자는 한국인 성인이고 한자·영어·일본어를 공부하고 있다. 설명은 한국어로, 사실만 쓴다. 어원이나 자원(字源)이 확실하지 않으면 지어내지 말고 "확실하지 않음"이라고 쓴다.

단어: «${word}»
${ctx ? "책에 나온 문장: «" + ctx + "»" : "문맥 없음: 가장 흔한 뜻으로 풀이하고, 뜻이 여럿이면 mean에서 나눠 설명한다."}

한 줄에 JSON 객체 하나씩, 아래 순서로만 출력한다. 각 객체는 반드시 한 줄에 쓴다. 코드펜스나 다른 글은 쓰지 않는다.
{"t":"head","word":"표제어(한자어면 한글과 한자를 함께, 예: 원리 原理)","reading":"발음 또는 읽는 법(영어는 발음기호, 일본어는 히라가나)","pos":"품사","gloss":"한 줄 뜻","en":"영어 대응어","ja":"일본어 대응어(읽는 법)"}
{"t":"mean","text":"뜻을 2~3문장으로. 문맥이 있으면 그 문장에서 무슨 뜻인지."}
{"t":"part","piece":"조각","reading":"읽기","sense":"조각의 뜻","note":"설명"}  ← 조각마다 한 줄
{"t":"origin","text":"조각들의 뜻이 어떻게 합쳐져 지금의 뜻이 되었는지, 왜 그런지 1~3문장"}
{"t":"ex","src":"예문","ko":"예문이 외국어면 한국어 번역, 아니면 빈 문자열"}  ← 2줄
{"t":"rel","items":["비슷한말·반대말·헷갈리는 말 3~5개, 각각 짧은 구분 설명 포함"]}
{"t":"img","q":"이 단어가 가리키는 것을 이미지 검색으로 찾기 좋은 검색어","wiki":"눈으로 볼 수 있는 사물·생물·장소·인물·도구일 때만 그것을 다루는 한국어 위키백과 문서 제목, 추상적인 말이면 빈 문자열","wiki_en":"같은 조건의 영어 위키백과 문서 제목, 아니면 빈 문자열"}

part 규칙:
- 한자로 쓸 수 있는 말(한국어 한자어, 일본어, 중국어): 한자 한 글자마다 part 한 줄. piece=한자 한 글자, reading="한국어 훈음(예: 근원 원) · 일본어 음독/훈독", sense=핵심 뜻, note=부수와 글자 구성 원리(어떤 요소가 합쳐져 왜 그 뜻이 되는지) 한 문장.
- 영어 등 서양 말: 접두사·어근·접미사마다 part 한 줄. piece=조각(예: bene-), reading=유래(예: 라틴어 bene), sense=뜻, note=같은 조각을 쓰는 다른 단어 2~3개와 뜻.
- 더 쪼갤 수 없는 고유어·단순어: part를 생략하고 origin에 어원을 쓴다.
en, ja는 표제어가 이미 그 언어면 빈 문자열.
글자 규칙: 한자와 부수는 폰에서 깨지지 않도록 일상적으로 쓰는 글자만 쓴다. 갑골문·금문에만 있는 옛 글자, 유니코드 확장 영역의 드문 글자, 부수 전용 기호는 쓰지 말고 "손을 뻗은 모양"처럼 말로 풀어 쓰거나 가장 가까운 흔한 한자로 대신한다.`;
}
function picPrompt(rec){
  const head = rec.lines.find(l => l.t === "head") || {};
  const parts = rec.lines.filter(l => l.t === "part").map(p => p.piece + "=" + p.sense).join(", ");
  return `«${head.word || rec.word}» (뜻: ${head.gloss || ""}${parts ? "; 조각: " + parts : ""}) 를 한눈에 이해하게 하는 그림을 SVG로 그려라.
- 구체적인 사물·동작이면 그 모습을 단순한 선과 면으로 그린다.
- 추상적인 말이면 개념을 도식(화살표, 대비, 단계)으로 보여 준다.
- 한자어나 형태소로 나뉘는 말이면 각 조각의 뜻이 합쳐져 단어의 뜻이 되는 과정을 그림으로 보여 준다.
규칙: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"> 로 시작하는 SVG 하나만 출력하고 설명 글은 쓰지 않는다. 첫 요소는 <rect width="400" height="260" fill="#fbfcf8"/>. 글자는 짧은 한국어 라벨만 쓰고 font-family="sans-serif", 크기 13 이상, 어두운 색, 그림 밖으로 나가지 않게 한다. 모든 도형에 fill을 명시한다. script, foreignObject, image, 외부 링크, 애니메이션은 쓰지 않는다.`;
}

/* ---------- 사진에서 단어 찾기 ---------- */
function renderFound(){
  $("foundSec").hidden = !found.length;
  $("chips").replaceChildren(...found.map(f =>
    h("button", {class: "chip", type: "button", onclick: () => lookup(f.w, f.c)},
      h("b", null, f.w, f.r ? " " : "", f.r ? h("span", null, f.r) : null),
      h("span", null, f.g || ""))));
}
async function scan(file){
  if (!file) return;
  const c = begin("s");
  found = []; renderFound();
  if (!getKey()) { say(COPY.no_key, true); return needKey("no_key"); }
  say("사진에서 단어를 찾는 중…");
  try {
    const image = await shrink(file);
    if (c !== C.s) return;
    const text = await ai(SCAN_PROMPT, {image, signal: c.signal,
      onText: t => { if (c !== C.s) return; found = parseLines(t, false).filter(x => x.w); renderFound(); }});
    if (c !== C.s) return;
    const all = parseLines(text, true);
    found = all.filter(x => x.w); renderFound();
    if (!found.length) say((all.find(x => x.err) || {}).err || "단어를 찾지 못했습니다. 더 가까이서 다시 찍어 보세요.", true);
    else { say(found.length + "개를 찾았습니다."); if (found.length === 1) lookup(found[0].w, found[0].c); }
  } catch (e) {
    if (c !== C.s || e.code === "cancelled") return;
    say(e.code ? copyFor(e.code) : "이 사진은 열 수 없습니다. 다른 사진으로 해 보세요.", true); needKey(e.code);
  }
}

/* ---------- 풀이 ---------- */
async function lookup(word, ctx, opt){
  word = (word || "").trim();
  if (!word) return;
  opt = opt || {};
  const saved = words.find(w => w.id === idFor(word));
  if (saved && !opt.fresh) return openSaved(saved);     // 이미 찾은 단어는 한도를 쓰지 않고 단어장에서 연다
  const c = begin("d"); C.p?.abort();
  const rec = {id: idFor(word), word, ctx: ctx || "", lines: [], svg: "", photos: [], ts: Date.now()};
  shown = rec; renderCard(rec, {loading: true});
  $("cardSlot").scrollIntoView({behavior: "smooth", block: "start"});
  try {
    const text = await ai(detailPrompt(word, rec.ctx), {signal: c.signal, best: opt.best,
      onText: t => { if (c !== C.d) return; rec.lines = parseLines(t, false); renderCard(rec, {loading: true}); }});
    if (c !== C.d) return;
    rec.lines = parseLines(text, true);
    if (!rec.lines.length) return renderCard(rec, {error: "풀이를 읽지 못했습니다. 다시 눌러 주세요."});
    rec.done = true;
    save(rec); renderCard(rec);
    photos(rec);
  } catch (e) {
    if (c !== C.d) return;
    if (e.code === "cancelled") { rec.lines = parseLines(e.text || "", true); return renderCard(rec); }
    renderCard(rec, {error: copyFor(e.code)}); needKey(e.code);
  }
}
/* 실제 사진은 위키백과에서 가져온다. 키도 한도도 필요 없고, 풀이가 '눈에 보이는 것'이라고 판단한 단어에만 붙는다. */
async function photos(rec){
  const img = rec.lines.find(l => l.t === "img") || {};
  const tries = [["ko", img.wiki], ["en", img.wiki_en]].filter(t => t[1]);
  for (const [lang, title] of tries) {
    try {
      // '검색'은 비슷한 글자의 엉뚱한 문서(염해 → 염해인)를 돌려주므로, 제목이 정확히 일치하는 문서만 쓴다.
      // 넘겨주기(redirect)는 따라가고, 문서가 없거나 동음이의 안내 문서면 사진을 붙이지 않는다.
      const u = `https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&redirects=1&prop=pageimages%7Cinfo%7Cpageprops%7Cdescription&ppprop=disambiguation&inprop=url&piprop=thumbnail&pithumbsize=480&format=json&origin=*`;
      const j = await (await fetch(u)).json();
      const pages = Object.values((j.query || {}).pages || {}).filter(p => !("missing" in p) && p.thumbnail && !p.pageprops).slice(0, 1);
      if (pages.length) {
        rec.photos = pages.map(p => ({src: p.thumbnail.source, title: p.title + (p.description ? " · " + p.description : ""), url: p.fullurl}));
        save(rec); if (shown === rec) renderCard(rec);
        return;
      }
    } catch (_) {}
  }
}
async function draw(rec, fresh){
  const c = begin("p");
  rec.pic = "loading"; if (shown === rec) renderCard(rec);
  try {
    const text = await ai(picPrompt(rec) + (fresh ? "\n(앞서 그린 것과 다른 구도로 그린다.)" : ""), {signal: c.signal, best: true});
    const m = text.match(/<svg[\s\S]*<\/svg>/i);
    if (!m) throw {code: "empty"};
    let svg = m[0];
    if (!/xmlns=/.test(svg)) svg = svg.replace(/<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
    rec.svg = svg; rec.pic = "";
    save(rec);
  } catch (e) {
    rec.pic = e.code === "cancelled" ? "" : "error";
    rec.picErr = e.code === "empty" ? "그림을 그리지 못했습니다." : copyFor(e.code);
  }
  if (shown === rec) renderCard(rec);
}

function renderCard(rec, st){
  st = st || {};
  const L = rec.lines, head = L.find(l => l.t === "head") || {};
  const by = t => L.filter(l => l.t === t);
  const parts = by("part"), exs = by("ex"), rel = by("rel")[0], mean = by("mean")[0], origin = by("origin")[0];
  const q = (by("img")[0] || {}).q || head.word || rec.word;
  const enc = encodeURIComponent;
  const kids = [];
  if (rec.example) kids.push(h("span", {class: "tag"}, "예시 · 이렇게 풀이됩니다"));
  kids.push(h("div", {class: "hw"},
    h("span", {class: "w"}, head.word || rec.word),
    head.reading ? h("span", {class: "r"}, head.reading) : null,
    head.pos ? h("span", {class: "pos"}, head.pos) : null));
  if (head.gloss) kids.push(h("p", {class: "gloss"}, head.gloss));
  if (head.en || head.ja) kids.push(h("p", {class: "tr"},
    head.en ? h("span", null, "English ", h("b", null, head.en)) : null,
    head.ja ? h("span", null, "日本語 ", h("b", null, head.ja)) : null));
  if (mean) kids.push(h("p", null, mean.text));
  if (rec.ctx) kids.push(h("div", {class: "ex"}, h("small", null, "책에 나온 문장"), rec.ctx));
  if (parts.length) kids.push(h("div", {class: "sec"}, h("h2", null, "쪼개 보기"),
    h("div", {class: "parts"}, parts.map(p => h("div", {class: "part"},
      h("div", {class: "g" + ([...String(p.piece || "")].length > 2 ? " long" : "")}, p.piece || ""),
      h("div", {class: "pr"}, p.reading || ""),
      h("div", {class: "ps"}, p.sense || ""),
      h("div", {class: "pn"}, p.note || ""))))));
  if (origin) kids.push(h("div", {class: "sec"}, h("h2", null, "왜 이런 뜻인가"), h("p", null, origin.text)));
  if (exs.length) kids.push(h("div", {class: "sec"}, h("h2", null, "예문"),
    exs.map(x => h("div", {class: "ex"}, x.src || "", x.ko ? h("small", null, x.ko) : null))));
  if (rel && Array.isArray(rel.items) && rel.items.length) kids.push(h("div", {class: "sec"}, h("h2", null, "함께 볼 말"),
    h("p", null, rel.items.join(" · "))));

  if (st.loading) kids.push(h("div", {class: "row"},
    h("span", {class: "status dots"}, L.length ? "이어서 쓰는 중" : "풀이를 만드는 중"),
    h("button", {class: "btn small", type: "button", onclick: () => C.d?.abort()}, "멈추기")));
  if (st.error) kids.push(h("div", {class: "row"},
    h("span", {class: "status err"}, st.error),
    h("button", {class: "btn small", type: "button", onclick: () => lookup(rec.word, rec.ctx, {fresh: true})}, "다시 찾기")));

  if (!st.loading && !st.error && L.length) {
    const sec = h("div", {class: "sec"}, h("h2", null, "그림으로 보기"));
    if ((rec.photos || []).length) sec.append(h("div", {class: "photos"}, rec.photos.map(p =>
      h("a", {href: p.url, target: "_blank", rel: "noopener"}, h("img", {src: p.src, alt: p.title, loading: "lazy"}), "위키백과: " + p.title))));
    if (rec.svg) sec.append(h("div", {class: "pic"}, h("img", {alt: (head.word || rec.word) + " 그림 설명",
      src: "data:image/svg+xml;charset=utf-8," + enc(rec.svg)})));
    const row = h("div", {class: "row"});
    if (rec.pic === "loading") row.append(h("span", {class: "status dots"}, "그림을 그리는 중"),
      h("button", {class: "btn small", type: "button", onclick: () => C.p?.abort()}, "멈추기"));
    else if (!rec.example) {
      if (rec.pic === "error") row.append(h("span", {class: "status err"}, rec.picErr || ""));
      row.append(h("button", {class: "btn small", type: "button", onclick: () => draw(rec, !!rec.svg)}, rec.svg ? "다시 그리기" : "그림 그리기"));
      if ((rec.photos || []).length) row.append(h("button", {class: "btn small", type: "button",
        onclick: () => { rec.photos = []; save(rec); renderCard(rec); }}, "사진 빼기"));
    }
    row.append(
      h("a", {href: "https://www.google.com/search?tbm=isch&q=" + enc(q), target: "_blank", rel: "noopener"}, "구글 이미지"),
      h("a", {href: "https://dict.naver.com/search.dict?query=" + enc(rec.word), target: "_blank", rel: "noopener"}, "네이버 사전"));
    sec.append(row);
    kids.push(sec);
    if (!rec.example) kids.push(h("div", {class: "row"},
      h("button", {class: "btn small", type: "button", onclick: () => lookup(rec.word, rec.ctx, {fresh: true, best: true})}, "더 정밀하게 다시 찾기"),
      words.some(w => w.id === rec.id) ? h("button", {class: "btn small", type: "button", onclick: () => removeWord(rec)}, "단어장에서 빼기") : null));
  }
  $("cardSlot").replaceChildren(h("article", {class: "card"}, kids));
}

/* ---------- 단어장 (이 기기에 저장) ---------- */
function persist(){
  if (ls.set("dd.words", words)) return;
  for (let i = words.length - 1; i >= 0 && !ls.set("dd.words", words); i--) words[i].svg = "";   // 자리가 모자라면 오래된 그림부터 비운다
}
function save(rec){
  const head = rec.lines.find(l => l.t === "head") || {};
  const b = {id: rec.id, word: rec.word, shown: head.word || rec.word, gloss: head.gloss || "", ctx: rec.ctx || "",
    lines: rec.lines, svg: rec.svg || "", photos: rec.photos || [], ts: rec.ts};
  words = [b, ...words.filter(w => w.id !== rec.id)].slice(0, 500);
  persist(); renderHist();
}
function removeWord(rec){
  words = words.filter(w => w.id !== rec.id); persist(); renderHist();
  if (shown === rec) { shown = null; $("cardSlot").replaceChildren(); }
}
function openSaved(w){
  C.d?.abort(); C.p?.abort();
  shown = {id: w.id, word: w.word, ctx: w.ctx || "", lines: w.lines || [], svg: w.svg || "", photos: w.photos || [], ts: w.ts, done: true};
  renderCard(shown);
  $("cardSlot").scrollIntoView({behavior: "smooth", block: "start"});
}
function renderHist(){
  $("histList").replaceChildren(...words.map(w => h("li", null,
    h("button", {type: "button", onclick: () => openSaved(w)}, h("b", null, w.shown || w.word), h("span", null, w.gloss || "")))));
  $("histCount").textContent = words.length ? "· " + words.length + "개" : "";
  $("histNote").textContent = words.length ? "" : "찾아본 단어가 여기에 쌓입니다. 인터넷이 없어도 다시 볼 수 있습니다.";
  $("exportBtn").hidden = !words.length;
}
/* Anki는 '탭으로 나눈 텍스트'를 그대로 카드로 가져온다. 앞면=단어, 뒷면=뜻과 쪼갠 풀이. */
function exportAnki(){
  const clean = s => String(s || "").replace(/[\t\r\n]+/g, " ");
  const rows = words.map(w => {
    const L = w.lines || [], head = L.find(l => l.t === "head") || {};
    const parts = L.filter(l => l.t === "part").map(p => `${p.piece} ${p.reading}: ${p.sense}`).join("<br>");
    const origin = (L.find(l => l.t === "origin") || {}).text || "";
    const back = [head.gloss, head.reading, parts, origin, w.ctx ? "문장: " + w.ctx : ""].filter(Boolean).join("<br>");
    return clean(w.shown || w.word) + "\t" + clean(back);
  });
  const blob = new Blob([rows.join("\n")], {type: "text/tab-separated-values"});
  const a = h("a", {href: URL.createObjectURL(blob), download: "단어돋보기-anki.tsv"});
  document.body.append(a); a.click(); a.remove();
}

$("form").addEventListener("submit", e => { e.preventDefault(); const v = $("q").value; $("q").blur(); lookup(v, ""); });
$("exportBtn").addEventListener("click", exportAnki);

$("key").value = getKey();
$("speechLang").value = ls.get("dd.speechLang", "ko-KR");
$("speechLang").addEventListener("change", e => ls.set("dd.speechLang", e.target.value));
if (!getKey()) { $("setBox").open = true; say(COPY.no_key); }
$("saveKey").addEventListener("click", async () => {
  const key = $("key").value.trim(), note = $("keyNote");
  note.classList.remove("err");
  if (!key) { ls.set("dd.key", ""); note.textContent = "키를 지웠습니다."; return; }
  ls.set("dd.key", key);
  note.textContent = "확인하는 중…";
  try {
    const ms = await listModels(key);
    if (ms.length) ls.set("dd.models", ms);
    note.textContent = "연결되었습니다. 쓸 모델: " + getModels().map(m => m.replace("gemini-", "")).join(", ");
    say("");
  } catch (e) {
    note.classList.add("err");
    note.textContent = e.code === "bad_key" ? "키가 맞지 않습니다. 복사가 끝까지 되었는지 확인해 주세요." : "지금은 확인하지 못했습니다. 키는 저장했습니다.";
  }
});

/* 음성: 브라우저에 내장된 음성 인식을 쓴다. 없는 브라우저에서는 키보드의 마이크 버튼을 쓰면 된다. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const mic = $("mic"); mic.hidden = false;
  let rec = null;
  const off = () => { rec = null; mic.classList.remove("on"); mic.setAttribute("aria-pressed", "false"); mic.textContent = "말하기"; };
  mic.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = $("speechLang").value; rec.interimResults = true;
    $("q").value = "";
    rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; $("q").value = t; };
    rec.onerror = e => { if (e.error !== "no-speech" && e.error !== "aborted") say("음성을 듣지 못했습니다. 직접 입력해 주세요.", true); };
    rec.onend = () => { off(); const v = $("q").value.trim().replace(/[.。?!]+$/, ""); if (v) { $("q").value = v; say(""); lookup(v, ""); } };
    try { rec.start(); mic.classList.add("on"); mic.setAttribute("aria-pressed", "true"); mic.textContent = "끝"; say("듣는 중…"); }
    catch (_) { off(); }
  });
}

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
